app-id: la.ogri.strongbox
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
    - org.freedesktop.Sdk.Extension.openjdk17

command: strongbox

finish-args:
    - --socket=x11
    - --share=network
    - --device=dri
    - --filesystem=host
    - --share=ipc

modules:
    - name: openjdk
      buildsystem: simple
      build-commands:
        - /usr/lib/sdk/openjdk17/install.sh

    - name: strongbox
      buildsystem: simple
      build-commands:
        - install -D metainfo.xml /app/share/metainfo/la.ogri.strongbox.metainfo.xml
        - install -D strongbox.desktop /app/share/applications/la.ogri.strongbox.desktop
        - install -D -m644 strongbox.svg /app/share/icons/hicolor/scalable/apps/la.ogri.strongbox.svg
        - install -D -m755 autogen.sh /app/bin/strongbox
        - install -D app.jar /app/bin/app.jar
      sources:
        - type: file
          url: https://github.com/ogri-la/strongbox/releases/download/7.8.1/strongbox-7.8.1-standalone.jar
          dest-filename: app.jar
          sha256: d31a5bae6e1f0f39be98a85a051c08534654f0e561430d28c3a7a06158dfdb59

        - type: script
          commands:
            - /app/jre/bin/java -jar /app/bin/app.jar "$@"

        - type: file
          url: https://raw.githubusercontent.com/ogri-la/strongbox-release-script/7.8.1/dist/flatpak/metainfo.xml
          sha256: 3785da3d5c6002f769acf60f4e98791e5a7a4f486824e04342dc117db97150c4

        - type: file
          url: https://raw.githubusercontent.com/ogri-la/strongbox-release-script/7.8.1/dist/flatpak/strongbox.desktop
          sha256: 130d35e55551d3f49a9145eefc039b241cdb73944562d4f77ceb1e8890e5211d

        - type: file
          url: https://raw.githubusercontent.com/ogri-la/strongbox-release-script/7.8.1/dist/flatpak/strongbox.svg
          sha256: 8dfc560af5dd0baf53aff6c3fd6ce2b9f149923b1f0dd1a20004a18b8ff70f50

