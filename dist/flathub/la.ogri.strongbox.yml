app-id: la.ogri.strongbox
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
    - org.freedesktop.Sdk.Extension.openjdk17

command: strongbox

finish-args:
    - --socket=x11
    - --share=network
    - --device=dri
    - --filesystem=host
    - --share=ipc

modules:
    - name: openjdk
      buildsystem: simple
      build-commands:
        - /usr/lib/sdk/openjdk17/install.sh

    - name: strongbox
      buildsystem: simple
      build-commands:
        - install -D metainfo.xml /app/share/metainfo/la.ogri.strongbox.metainfo.xml
        - install -D strongbox.desktop /app/share/applications/la.ogri.strongbox.desktop
        - install -D -m644 strongbox.svg /app/share/icons/hicolor/scalable/apps/la.ogri.strongbox.svg
        - install -D -m755 autogen.sh /app/bin/strongbox
        - install -D app.jar /app/bin/app.jar
      sources:
        - type: file
          url: https://github.com/ogri-la/strongbox/releases/download/7.8.0/strongbox-7.8.0-standalone.jar
          dest-filename: app.jar
          sha256: 72a5203e843fb6655825b17b18c4eb6e8b5b0106452e26bb2cd55a04593d25b7

        - type: script
          commands:
            - /app/jre/bin/java -jar /app/bin/app.jar "$@"

        - type: file
          url: https://raw.githubusercontent.com/ogri-la/strongbox-release-script/7.8.0/dist/flatpak/metainfo.xml
          sha256: 8337769e80f0c5cd9a49c3ddc0fe6c8662e9f1868e6d0052873385fc3b60bf06

        - type: file
          url: https://raw.githubusercontent.com/ogri-la/strongbox-release-script/7.8.0/dist/flatpak/strongbox.desktop
          sha256: 130d35e55551d3f49a9145eefc039b241cdb73944562d4f77ceb1e8890e5211d

        - type: file
          url: https://raw.githubusercontent.com/ogri-la/strongbox-release-script/7.8.0/dist/flatpak/strongbox.svg
          sha256: 8dfc560af5dd0baf53aff6c3fd6ce2b9f149923b1f0dd1a20004a18b8ff70f50

