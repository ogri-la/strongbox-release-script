app-id: la.ogri.strongbox
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
    - org.freedesktop.Sdk.Extension.openjdk17

command: strongbox

finish-args:
    - --socket=x11
    - --share=network
    - --device=dri
    - --filesystem=host
    - --share=ipc

modules:
    - name: openjdk
      buildsystem: simple
      build-commands:
        - /usr/lib/sdk/openjdk17/install.sh

    - name: strongbox
      buildsystem: simple
      build-commands:
        - install -D metainfo.xml /app/share/metainfo/la.ogri.strongbox.metainfo.xml
        - install -D strongbox.desktop /app/share/applications/la.ogri.strongbox.desktop
        - install -D -m644 strongbox.svg /app/share/icons/hicolor/scalable/apps/la.ogri.strongbox.svg
        - install -D -m755 autogen.sh /app/bin/strongbox
        - install -D app.jar /app/bin/app.jar
      sources:
        - type: file
          url: https://github.com/ogri-la/strongbox/releases/download/{{ version }}/strongbox-{{ version }}-standalone.jar
          dest-filename: app.jar
          sha256: {{ sha256_jar }}

        - type: script
          commands:
            - /app/jre/bin/java -jar /app/bin/app.jar "$@"

        - type: file
          url: https://raw.githubusercontent.com/ogri-la/strongbox-release-script/{{ version }}/dist/flatpak/metainfo.xml
          sha256: {{ sha256_flatpak_metainfo_xml }}

        - type: file
          url: https://raw.githubusercontent.com/ogri-la/strongbox-release-script/{{ version }}/dist/flatpak/strongbox.desktop
          sha256: {{ sha256_flatpak_strongbox_desktop }}

        - type: file
          url: https://raw.githubusercontent.com/ogri-la/strongbox-release-script/{{ version }}/dist/flatpak/strongbox.svg
          sha256: {{ sha256_flatpak_strongbox_svg }}

